<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工場資料 - 川越屋千葉工場</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        /* メタル風ボタン（戻るボタン用） */
        .metal-btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #d0d0d0 51%, #e0e0e0 100%);
            color: #333 !important;
            padding: 10px 30px;
            border-radius: 50px;
            border: 1px solid #999;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 5px rgba(0,0,0,0.5);
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
        }
        .metal-btn-back:hover {
            background: linear-gradient(135deg, #f0f0f0 0%, #ffffff 50%, #e0e0e0 51%, #f0f0f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        
        .img-container img {
            width: 100%;
            max-width: 1000px; /* PCで見すぎないように最大幅を設定 */
            margin: 0 auto;
            display: block;
        }
        
        /* ページ全体のフェードイン */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="fade-in">

    <!-- 戻るボタン -->
    <a href="factory.html" class="metal-btn-back">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        前に戻る
    </a>

    <!-- 画像一覧コンテナ -->
    <div class="flex flex-col items-center justify-center py-20 px-4 space-y-2">
        <!-- Page 1 (表紙) -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0001.jpg" alt="Page 1">
        </div>
        
        <!-- Page 2 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0002.jpg" alt="Page 2">
        </div>

        <!-- Page 3 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0003.jpg" alt="Page 3">
        </div>

        <!-- Page 4 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0004.jpg" alt="Page 4">
        </div>

        <!-- Page 5 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0005.jpg" alt="Page 5">
        </div>

        <!-- Page 6 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0006.jpg" alt="Page 6">
        </div>

        <!-- Page 7 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0007.jpg" alt="Page 7">
        </div>

        <!-- Page 8 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0008.jpg" alt="Page 8">
        </div>

        <!-- Page 9 -->
        <div class="img-container">
            <img src="./product_kakoujou_page-0009.jpg" alt="Page 9">
        </div>
    </div>

    <!-- ページ下部の戻るボタン（スマホ用） -->
    <div class="flex justify-center pb-20">
         <a href="factory.html" class="metal-btn-back !static !transform-none !shadow-none hover:!translate-y-[-2px]">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            施設概要トップへ戻る
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
