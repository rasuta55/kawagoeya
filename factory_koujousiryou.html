<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社川越屋 新加工場のご案内</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #525252; /* 画像が際立つ濃いグレーの背景 */
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .page-container {
            max-width: 1000px; /* PCで見やすい最大幅 */
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .page-image {
            display: block; /* 画像下の隙間を完全に除去 */
            width: 100%;
            height: auto;
            border-bottom: 1px solid #f3f4f6; /* ページ区切りを薄く入れる（任意） */
        }
        /* 最後の画像の下線は削除 */
        .page-image:last-child {
            border-bottom: none;
        }
        
        /* プレビュー環境での画像切れ対策（alt表示用スタイル） */
        img:not([src]) {
            visibility: hidden;
        }
        
        /* 画像読み込みエラー時の表示スタイル（ローカル確認前用） */
        .page-image {
            min-height: 50px; 
            background-color: #f0f0f0;
            position: relative;
            text-align: center;
            color: #666;
            font-family: sans-serif;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 画像が正しくロードされたら背景などをリセット */
        img[src*=".jpg"] {
            min-height: auto;
            background-color: transparent;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      注意: このHTMLファイルを正常に表示するには、
      以下の画像ファイルがHTMLと同じフォルダにある必要があります。
      - product_kakoujou_page-0001.jpg
      - product_kakoujou_page-0002.jpg
      - ...
      - product_kakoujou_page-0009.jpg
    -->

    <div class="page-container">
        <img src="product_kakoujou_page-0001.jpg" alt="ページ1: 表紙 株式会社川越屋 新加工場のご案内" class="page-image">
        <img src="product_kakoujou_page-0002.jpg" alt="ページ2: 新加工場概要（外観・低温倉庫・入口）" class="page-image">
        <img src="product_kakoujou_page-0003.jpg" alt="ページ3: 新設備・新設作業室（焙煎室・選別室）" class="page-image">
        <img src="product_kakoujou_page-0004.jpg" alt="ページ4: 新工場の生産能力と特徴" class="page-image">
        <img src="product_kakoujou_page-0005.jpg" alt="ページ5: 流動層焙煎機 (New Machine)" class="page-image">
        <img src="product_kakoujou_page-0006.jpg" alt="ページ6: アーモンド・くるみ 光学選別機" class="page-image">
        <img src="product_kakoujou_page-0007.jpg" alt="ページ7: 光学選別機 仕組み詳細図" class="page-image">
        <img src="product_kakoujou_page-0008.jpg" alt="ページ8: 新コーティングマシン Coaterow NEXT" class="page-image">
        <img src="product_kakoujou_page-0009.jpg" alt="ページ9: 一貫した製造・パティシエメッセージ" class="page-image">
    </div>

</body>
</html>
