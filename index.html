<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川越屋 KAWAGOEYA - 創作</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #F9F7F2;
            color: #2C2C2C;
        }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-sans { font-family: 'Noto Sans JP', sans-serif; }
        
        /* モーダル表示時のアニメーション */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-animate {
            animation: fadeIn 0.3s ease-out;
        }

        /* メタル風ボタンのスタイル */
        .metal-btn {
            display: inline-block;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #d0d0d0 51%, #e0e0e0 100%);
            color: #333 !important;
            padding: 8px 24px;
            border-radius: 4px;
            border: 1px solid #999;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 2px 3px rgba(0,0,0,0.3);
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }
        
        .metal-btn:hover {
            background: linear-gradient(135deg, #f0f0f0 0%, #ffffff 50%, #e0e0e0 51%, #f0f0f0 100%);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.9),
                0 0 10px rgba(255,255,255,0.5),
                0 3px 6px rgba(0,0,0,0.4);
            transform: translateY(-1px);
            color: #000 !important;
        }
        
        .metal-btn:active {
            background: linear-gradient(135deg, #d0d0d0 0%, #e0e0e0 50%, #c0c0c0 51%, #d0d0d0 100%);
            box-shadow: 
                inset 0 2px 5px rgba(0,0,0,0.2);
            transform: translateY(1px);
        }

        /* パスワード入力フィールドのスタイル */
        .password-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 15px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 0.2em;
            font-size: 1.1rem;
        }
        .password-input:focus {
            background: rgba(255,255,255,0.15);
            border-color: #C5A059;
        }
        .password-input::placeholder {
            color: rgba(255,255,255,0.3);
            letter-spacing: normal;
            font-size: 0.9rem;
        }

        /* 特設ページオーバーレイのスタイル */
        #secret-overlay {
            background-color: #1a1a1a;
            color: white;
        }
    </style>
</head>
<body>

    <!-- アプリケーションのコンテナ -->
    <div id="app">
        <!-- コンテンツはJavaScriptによってここに描画されます -->
    </div>

    <!-- JavaScript Logic -->
    <script>
        const BRAND_COLORS = {
            primary: '#4B2E1E',
            bg: '#F9F7F2',
        };

        // ★修正点: 実際のサイトのURLベース
        const BASE_URL = 'https://rasuta55.github.io/kawagoeya';

        // ★プレビュー用の仮画像データ
        window.PREVIEW_LOGO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><rect width='200' height='60' fill='transparent'/><text x='100' y='40' font-family='Noto Serif JP, serif' font-weight='bold' font-size='24' text-anchor='middle' fill='%234B2E1E'>KAWAGOEYA</text></svg>`;
        window.PREVIEW_HERO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' style='background:%234B2E1E'><text x='50%' y='50%' font-family='sans-serif' font-weight='bold' font-size='40' text-anchor='middle' fill='white'>TOP画像</text></svg>`;

        const PAGE_CONTENT = {
            logoImage: `${BASE_URL}/logo.png`, 
            footerVideo: `${BASE_URL}/MINANA製造工程.mp4`,
            footerImage: `${BASE_URL}/7moro.png`,
            
            hero: {
                title: "創作", 
                subtitle: "ナッツ菓子の技、一粒の芸術。",
                description: "川越屋公認ナッツパティシエが、素材の選定から包装まで、全ての工程に魂を込めて。",
                bgImage: `${BASE_URL}/hero.jpg`,
                fallbackBgImage: "https://images.unsplash.com/photo-1516550135131-fe3dcb0bedc7?q=80&w=1920&auto=format&fit=crop" 
            },
            intro: {
                title: "ナッツパティシエの流儀",
                text: "私たち川越屋は、単にナッツを焼くだけではありません。<br>気温や湿度、ナッツの状態を見極め、職人の経験値で焙煎を調整する。<br>味付は、まさに、パティシエがケーキを作るような繊細な作業です。<br>伝統の技と新しい感性を融合させ、記憶に残る味わいを創造します。"
            }
        };

        const PROCESS_STEPS = [
            {
                id: 1,
                title: "原料入荷",
                engTitle: "Arrival",
                description: "海外からアーモンドやクルミ、カシューナッツなどを調達しています。品質証明書だけでなく、熟練の目利きで鮮度と粒の大きさを確認します。",
                icon: "truck", 
                image: `${BASE_URL}/step1.png`
            },
            {
                id: 2,
                title: "選別",
                engTitle: "Selection",
                description: "最新鋭の選別機と、人の目による最終確認のダブルチェック体制。欠けや変色のある豆を徹底的に取り除き、良質な粒だけを次の工程へ送ります。",
                icon: "check-circle", 
                image: `${BASE_URL}/step2.png`
            },
            {
                id: 3,
                title: "焙煎",
                engTitle: "Roasting",
                description: "味の決め手となる焙煎。ナッツの種類ごとに最適な温度と時間を設定し、芯まで均一に火を通すことで、香ばしさとカリッとした食感を引き出します。",
                icon: "flame",
                image: `${BASE_URL}/step3.jpg`
            },
            {
                id: 4,
                title: "糖掛け",
                engTitle: "Sugar Coating",
                description: "釜を使用し、熟練の職人が手作業で糖蜜を絡めます。温度管理を徹底し、均一な衣を作ることで、上品な甘さと美しい艶を生み出します。",
                icon: "droplets",
                image: `${BASE_URL}/step4.jpg`
            },
            {
                id: 5,
                title: "味付け",
                engTitle: "Seasoning",
                description: "きな粉、ラズベリーなど、多彩なフレーバーを纏わせます。素材の風味を損なわないよう、パウダーはたっぷり使い、職人の目で確かめながら作業しています。",
                icon: "utensils",
                image: `${BASE_URL}/step5.jpg`
            },
            {
                id: 6,
                title: "包装",
                engTitle: "Packaging",
                description: "正確、丁寧をモットーに真心こめてパッケージングしています。金属探知機による最終検査を経て、皆様のもとへ出荷されます。",
                icon: "gift",
                image: `${BASE_URL}/step6.jpg`
            }
        ];

        /* === スマホメニュー制御 === */
        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobileMenu');
            if (menu) {
                if (menu.classList.contains('translate-x-full')) {
                    menu.classList.remove('translate-x-full');
                } else {
                    menu.classList.add('translate-x-full');
                }
            }
        }

        /* === 動画モーダル制御 === */
        window.openVideoModal = function() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                modal.classList.remove('hidden');
                modal.classList.add('flex'); 
                video.play().catch(e => console.log('Auto-play prevented:', e));
            }
        }

        window.closeVideoModal = function() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                video.pause();
                video.currentTime = 0;
            }
        }

        /* === パスワードモーダル制御 === */
        window.openPasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.value = ''; // 入力をリセット
            error.classList.add('hidden'); // エラー表示をリセット
            setTimeout(() => input.focus(), 100);
        }

        window.closePasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.checkPassword = function() {
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            const password = input.value.toLowerCase().trim();
            
            // パスワード: neomoro
            if (password === 'neomoro') {
                closePasswordModal();
                openSecretPage();
            } else {
                error.classList.remove('hidden');
                input.classList.add('border-red-500');
                setTimeout(() => input.classList.remove('border-red-500'), 2000);
            }
        }

        window.openSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.8s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 800);
            document.body.style.overflow = '';
        }

        /* === 描画ロジック === */

        function renderApp() {
            const app = document.getElementById('app');
            
            const NAV_LINKS = [
                { label: 'ホーム', href: './index.html' },
                { label: '加工場設備', href: './factory.html' },
                { label: '商品一覧', href: './products.html' }
            ];

            const navItems = NAV_LINKS.map(item => 
                `<a href="${item.href}" class="metal-btn">${item.label}</a>`
            ).join('');

            // スマホ用メニューアイテム (メタルボタンクラス付き)
            const mobileNavItems = NAV_LINKS.map(item => 
                `<a href="${item.href}" class="metal-btn text-lg py-3 px-8 w-64 text-center">${item.label}</a>`
            ).join('');

            const stepsHtml = PROCESS_STEPS.map((step, index) => {
                const stepNum = String(index + 1).padStart(2, '0');
                return `
                <div class="group relative bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 border-b-4" style="border-color: ${BRAND_COLORS.primary}">
                    <div class="relative h-64 overflow-hidden">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors z-10"></div>
                        <img src="${step.image}" alt="${step.title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" 
                            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1599599810694-b5b37304c041?q=80&w=800&auto=format&fit=crop';">
                        <div class="absolute top-4 left-4 z-20 w-12 h-12 flex items-center justify-center bg-white/90 backdrop-blur rounded-full shadow-lg">
                            <span class="font-serif text-xl font-bold" style="color: ${BRAND_COLORS.primary}">${stepNum}</span>
                        </div>
                    </div>
                    <div class="p-8">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="p-2 rounded-full bg-orange-50 text-orange-800">
                                <i data-lucide="${step.icon}" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <span class="block text-xs uppercase tracking-widest text-gray-500 mb-1">${step.engTitle}</span>
                                <h3 class="text-2xl font-serif font-bold" style="color: ${BRAND_COLORS.primary}">${step.title}</h3>
                            </div>
                        </div>
                        <p class="text-gray-600 leading-relaxed text-sm lg:text-base">${step.description}</p>
                    </div>
                </div>
                `;
            }).join('');

            app.innerHTML = `
                <!-- Mobile Menu Overlay -->
                <div id="mobileMenu" class="fixed inset-0 z-[60] bg-white/95 backdrop-blur-md flex flex-col justify-center items-center space-y-8 transition-transform duration-300 translate-x-full md:hidden">
                    <button onclick="toggleMobileMenu()" class="absolute top-6 right-6 text-gray-800 p-2">
                        <i data-lucide="x" class="w-10 h-10"></i>
                    </button>
                    ${mobileNavItems}
                </div>

                <!-- Video Modal -->
                <div id="videoModal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/80 backdrop-blur-sm modal-animate" onclick="closeVideoModal()">
                    <div class="relative w-full max-w-4xl mx-4" onclick="event.stopPropagation()">
                        <button onclick="closeVideoModal()" class="absolute -top-12 right-0 text-white hover:text-orange-400 transition-colors flex items-center gap-2">
                            <span class="text-sm font-bold">CLOSE</span>
                            <i data-lucide="x" class="w-8 h-8"></i>
                        </button>
                        <div class="aspect-video bg-black rounded-lg shadow-2xl overflow-hidden flex items-center justify-center relative">
                            <video id="promoVideo" controls class="w-full h-full object-contain">
                                <source src="${PAGE_CONTENT.footerVideo}" type="video/mp4">
                                <p class="text-white text-center p-4">動画を再生できません。</p>
                            </video>
                        </div>
                    </div>
                </div>

                <!-- Password Entry Modal -->
                <div id="passwordModal" class="hidden fixed inset-0 z-[150] items-center justify-center bg-black/90 backdrop-blur-md modal-animate" onclick="closePasswordModal()">
                    <div class="relative w-full max-w-md mx-4 bg-[#2C2C2C] border border-white/10 p-8 rounded-lg shadow-2xl" onclick="event.stopPropagation()">
                        <button onclick="closePasswordModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                        
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4 border border-[#C5A059]/30">
                                <i data-lucide="lock" class="w-8 h-8 text-[#C5A059]"></i>
                            </div>
                            <h3 class="text-2xl font-serif text-white mb-2">Members Only</h3>
                            <p class="text-gray-400 text-sm">特設ページへのアクセスには<br>パスワードが必要です</p>
                        </div>
                        
                        <div class="space-y-4">
                            <input type="password" id="secretPassword" class="password-input font-serif" placeholder="PASSWORD">
                            <button onclick="checkPassword()" class="w-full bg-[#C5A059] text-[#2C2C2C] font-bold py-3 rounded hover:bg-white transition-colors tracking-widest">
                                ENTER
                            </button>
                            <p id="passwordError" class="text-red-500 text-xs text-center hidden">パスワードが間違っています</p>
                        </div>
                        <div class="mt-6 text-center">
                             <p class="text-xs text-gray-600">Hint: neomoro</p>
                        </div>
                    </div>
                </div>

                <!-- SECRET CONTENT OVERLAY -->
                <div id="secret-overlay" class="hidden fixed inset-0 z-[200] overflow-y-auto bg-[#2C2C2C]">
                    <!-- 戻るボタン -->
                    <button onclick="closeSecretPage()" class="fixed top-6 left-6 z-50 flex items-center gap-2 bg-[#C5A059] text-[#2C2C2C] px-6 py-2 rounded-full font-bold shadow-lg hover:bg-white transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                        ログアウト
                    </button>

                    <div class="min-h-screen flex flex-col items-center justify-center py-20 px-6">
                        <div class="text-center max-w-4xl mx-auto">
                            <span class="text-[#C5A059] text-xl tracking-[0.3em] block mb-4 font-bold">EXCLUSIVE CONTENTS</span>
                            <h1 class="text-4xl md:text-6xl font-serif text-white mb-12">視聴者限定 特設ページ</h1>
                            
                            <div class="bg-white/5 border border-white/10 p-12 rounded-lg backdrop-blur-sm shadow-2xl">
                                <div class="w-20 h-20 bg-[#C5A059]/20 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i data-lucide="gift" class="w-10 h-10 text-[#C5A059]"></i>
                                </div>
                                <h2 class="text-2xl font-bold mb-4 text-white">パスワード認証ありがとうございます。</h2>
                                <p class="text-gray-300 leading-relaxed mb-8">
                                    ここは限られた方のみがアクセスできる特別なエリアです。
                                </p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                                    <div class="bg-black/30 p-6 rounded border border-white/5 hover:border-[#C5A059]/50 transition-colors cursor-pointer group">
                                         <span class="text-[#C5A059] text-xs font-bold tracking-widest mb-2 block">Official Video</span>
                                         <h3 class="text-lg font-bold text-white group-hover:text-[#C5A059] transition-colors">NEOMORO党：党員募集</h3>
                                         <p class="text-xs text-gray-500 mt-2">応募条件についてはお問い合わせください。</p>
                                    </div>
                                    <div class="bg-black/30 p-6 rounded border border-white/5 hover:border-[#C5A059]/50 transition-colors cursor-pointer group">
                                         <span class="text-[#C5A059] text-xs font-bold tracking-widest mb-2 block">Amazon Prime Video</span>
                                         <h3 class="text-lg font-bold text-white group-hover:text-[#C5A059] transition-colors">映画：NEOMORO公開記念PV</h3>
                                         <p class="text-xs text-gray-500 mt-2">何故、人々は熱狂するのか</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Header -->
                <header id="main-header" class="absolute w-full z-50 py-4">
                    <div class="container mx-auto px-6 flex justify-between items-center">
                        <div class="flex items-center">
                            <img src="${PAGE_CONTENT.logoImage}" alt="KAWAGOEYA" class="h-12 w-auto object-contain" onerror="this.onerror=null; this.src=window.PREVIEW_LOGO_DATA;">
                        </div>
                        <nav class="hidden md:flex gap-4">
                            ${navItems}
                        </nav>
                        <button class="md:hidden text-gray-800 bg-white/80 p-2 rounded-full backdrop-blur-sm" onclick="toggleMobileMenu()">
                            <i data-lucide="menu" class="w-6 h-6"></i>
                        </button>
                    </div>
                </header>

                <!-- Hero Section -->
                <section class="relative h-[65vh] lg:h-[85vh] flex items-center justify-center overflow-hidden bg-[#4B2E1E]">
                    <div class="absolute inset-0 z-0">
                        <img 
                            src="${PAGE_CONTENT.hero.bgImage}" 
                            alt="Background" 
                            class="w-full h-full object-cover object-top opacity-90" 
                            onerror="this.onerror=null; this.src='${PAGE_CONTENT.hero.fallbackBgImage}';"
                        >
                        <div class="absolute inset-0 bg-gradient-to-b from-black/50 to-black/20"></div>
                    </div>
                    <div class="relative z-10 container mx-auto px-6 text-center text-white">
                        <span class="inline-block py-1 px-3 border border-white/30 rounded-full text-xs tracking-[0.2em] mb-6 backdrop-blur-sm">
                            MANUFACTURING PROCESS
                        </span>
                        <h1 class="text-5xl md:text-7xl font-serif font-bold mb-6 tracking-wide drop-shadow-lg">
                            ${PAGE_CONTENT.hero.title}
                        </h1>
                        <p class="text-xl md:text-2xl font-light tracking-wider opacity-90 mb-8 font-serif drop-shadow-md">
                            ${PAGE_CONTENT.hero.subtitle}
                        </p>
                        <div class="w-24 h-1 bg-orange-400 mx-auto rounded-full"></div>
                    </div>
                </section>

                <!-- Intro Section -->
                <section class="py-20 md:py-32 px-6">
                    <div class="container mx-auto max-w-4xl text-center">
                        <div class="mb-8 flex justify-center">
                             <div class="w-16 h-16 opacity-20 bg-center bg-no-repeat bg-contain" style="background-image: url('https://cdn-icons-png.flaticon.com/512/2619/2619528.png'); filter: sepia(1);"></div>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-serif font-bold mb-10 text-gray-800">
                            ${PAGE_CONTENT.intro.title}
                        </h2>
                        <p class="text-lg leading-loose text-gray-600 font-medium">
                            ${PAGE_CONTENT.intro.text}
                        </p>
                    </div>
                </section>

                <!-- Process Grid -->
                <section class="py-20 px-6 bg-white">
                    <div class="container mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-end mb-16 border-b pb-6 border-gray-100">
                            <div>
                                <span class="text-orange-600 font-bold tracking-widest text-sm block mb-2">THE PROCESS</span>
                                <h2 class="text-3xl md:text-4xl font-serif font-bold text-gray-800">
                                    美味しさを創る6つの工程
                                </h2>
                            </div>
                            <p class="text-gray-500 mt-4 md:mt-0 max-w-md text-sm">
                                一つひとつの工程に妥協せず、素材のポテンシャルを最大限に引き出す。それが川越屋のスタンダードです。
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-12">
                            ${stepsHtml}
                        </div>
                    </div>
                </section>

                <!-- OEM / Contact -->
                <section class="py-24 px-6 relative overflow-hidden text-white" style="background-color: ${BRAND_COLORS.primary}">
                    <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                        <div class="w-96 h-96 rounded-full bg-white absolute -top-20 -left-20 blur-3xl"></div>

            // Lucideアイコンの初期化
            lucide.createIcons();

            // スクロールイベントの設定（トップへ戻るボタンのみ）
            const scrollBtn = document.getElementById('scrollToTop');

            window.addEventListener('scroll', () => {
                const scrolled = window.scrollY > 50;
                
                if (scrolled) {
                    scrollBtn.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    scrollBtn.classList.add('opacity-100', 'translate-y-0');
                } else {
                    scrollBtn.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    scrollBtn.classList.remove('opacity-100', 'translate-y-0');
                }
            });

            // トップへ戻るボタン
            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            // Password input Enter key support
            const passInput = document.getElementById('secretPassword');
            if(passInput) {
                passInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
