<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川越屋 KAWAGOEYA - 創作</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        :root {
            --gold-primary: #C5A059;
            --gold-light: #FFD700;
            --gold-dark: #8B6508;
            --bg-metal-1: #8a8a8a;
            --bg-metal-2: #b0b0b0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: #1a1a1a;
            /* --- リアルステンレス背景（動く光沢） --- */
            background-color: var(--bg-metal-1);
            background-image: 
                repeating-linear-gradient(0deg, transparent 0px, transparent 1px, rgba(255, 255, 255, 0.05) 1px, rgba(255, 255, 255, 0.05) 2px),
                linear-gradient(110deg, #999 0%, #ddd 20%, #bbb 40%, #fff 50%, #bbb 60%, #ddd 80%, #999 100%);
            background-size: 200% 200%;
            background-blend-mode: overlay;
            background-attachment: fixed;
            animation: metalShine 15s ease infinite alternate; /* 背景がゆっくり輝く */
            overflow-x: hidden;
            cursor: none; /* カスタムカーソルのためデフォルトを消す */
        }
        
        /* カスタムカーソル */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            transition: width 0.3s, height 0.3s;
        }
        #cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background-color: var(--gold-light);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            box-shadow: 0 0 10px var(--gold-primary);
        }

        @keyframes metalShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-sans { font-family: 'Noto Sans JP', sans-serif; }
        
        /* フェードイン＆ズームアップアニメーション */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* --- 究極のピアノブラック・ガラスコーティングパネル（派手Ver） --- */
        .glossy-black-panel {
            background-color: #000000;
            background-image: linear-gradient(160deg, #1a1a1a 0%, #000000 100%);
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            /* 輝く枠線 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 0 0 1px rgba(0,0,0,1); /* 二重枠 */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* パネル表面の流れる光沢 */
        .glossy-black-panel::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
            pointer-events: none;
        }

        /* ホバー時のド派手な演出 */
        .glossy-black-panel:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--gold-primary);
            box-shadow: 
                0 30px 70px rgba(0,0,0,0.9),
                0 0 30px rgba(197, 160, 89, 0.4), /* ゴールドのグロー */
                inset 0 0 20px rgba(197, 160, 89, 0.2);
        }
        .glossy-black-panel:hover::after {
            left: 200%; /* 光が走る */
            transition: 0.7s ease-in-out;
        }

        /* --- メタルプレート（ヘッダー・フッター） --- */
        .metal-plate {
            background: linear-gradient(180deg, #f8f8f8 0%, #d0d0d0 49%, #a8a8a8 50%, #d8d8d8 100%);
            border-top: 1px solid #fff;
            border-bottom: 2px solid #555;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            color: #1a1a1a;
            position: relative;
        }
        /* プレートの反射 */
        .metal-plate::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: metalShine 8s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        /* --- リアル・ステンレスボタン --- */
        .metal-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #fff 0%, #e0e0e0 49%, #b0b0b0 50%, #d0d0d0 100%);
            color: #000 !important;
            padding: 12px 30px; border-radius: 4px; border: 1px solid #666;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 #fff;
            font-weight: 900; text-decoration: none;
            font-family: 'Noto Serif JP', serif; font-size: 0.95rem; letter-spacing: 0.1em;
            position: relative; overflow: hidden;
            transition: all 0.2s;
        }
        .metal-btn::after {
            content: '';
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            opacity: 0;
        }
        .metal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4), 0 0 15px rgba(255,255,255,0.6);
            border-color: #999;
        }
        .metal-btn:hover::after {
            opacity: 1; left: 100%;
        }

        /* --- ゴールドボタン（鏡面・発光） --- */
        .gold-metal-btn {
            background: linear-gradient(180deg, #fff8db 0%, #f0c350 49%, #c59237 50%, #e6be6d 100%);
            border: 1px solid #b8860b;
            color: #3e2723 !important;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 0 15px rgba(197, 160, 89, 0.4); /* 常時発光 */
            font-weight: 900;
        }
        .gold-metal-btn:hover {
            background: linear-gradient(180deg, #fff 0%, #ffd700 49%, #daa520 50%, #f0e68c 100%);
            box-shadow: 
                0 6px 20px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,1),
                0 0 30px rgba(255, 215, 0, 0.8); /* 強烈な発光 */
            transform: scale(1.05);
        }

        /* --- タイトル文字デザイン（派手） --- */
        .glass-navy-text {
            background: linear-gradient(135deg, #a0c0ff 0%, #203060 50%, #000033 51%, #405080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* ゴールドの縁取り + 影 */
            filter: drop-shadow(0 0 2px rgba(197, 160, 89, 0.8)) drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            -webkit-text-stroke: 1px rgba(197, 160, 89, 0.8);
            position: relative;
            z-index: 10;
        }
        
        .title-glow {
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(197, 160, 89, 0.6),
                0 0 40px rgba(197, 160, 89, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(197,160,89,0.6); }
            100% { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(197,160,89,1), 0 0 60px rgba(197,160,89,0.6); }
        }

        /* --- テキストエフェクト --- */
        .text-engrave {
            color: #333;
            background-color: #555;
            -webkit-background-clip: text;
            -moz-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5);
        }

        /* --- ローディング演出 --- */
        #loading-screen {
            position: fixed; inset: 0; background: #000; z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .loader-logo {
            font-family: 'Noto Serif JP', serif;
            font-size: 3rem; font-weight: 900; color: transparent;
            background: linear-gradient(90deg, #8B6508 0%, #FFD700 50%, #8B6508 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            animation: shineText 2s linear infinite;
        }
        @keyframes shineText { to { background-position: 200% center; } }

        /* オーバーレイ共通 */
        .overlay-base {
            background-color: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- カスタムカーソル -->
    <div id="cursor-glow"></div>
    <div id="cursor-dot"></div>

    <!-- ローディング画面 -->
    <div id="loading-screen">
        <div class="text-center">
            <div class="loader-logo">KAWAGOEYA</div>
            <p class="text-[#C5A059] mt-2 tracking-[0.5em] text-sm animate-pulse">PREMIUM NUTS FACTORY</p>
        </div>
    </div>

    <!-- アプリケーションのコンテナ -->
    <div id="app"></div>

    <!-- JavaScript Logic -->
    <script>
        // カーソル追従ロジック
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            const dot = document.getElementById('cursor-dot');
            
            // 少し遅延させる
            setTimeout(() => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }, 50);

            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
        });

        // ホバー時にカーソルを大きくする
        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.glossy-black-panel')) {
                document.getElementById('cursor-glow').style.width = '150px';
                document.getElementById('cursor-glow').style.height = '150px';
                document.getElementById('cursor-glow').style.background = 'radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%)';
            } else {
                document.getElementById('cursor-glow').style.width = '400px';
                document.getElementById('cursor-glow').style.height = '400px';
                document.getElementById('cursor-glow').style.background = 'radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, transparent 70%)';
            }
        });

        const BRAND_COLORS = {
            primary: '#4B2E1E',
            gold: '#C5A059',
            bg: '#F9F7F2',
        };

        const BASE_URL = 'https://rasuta55.github.io/kawagoeya';

        window.PREVIEW_LOGO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><rect width='200' height='60' fill='transparent'/><text x='100' y='40' font-family='Noto Serif JP, serif' font-weight='900' font-size='28' text-anchor='middle' fill='%231a1a1a' stroke='%23fff' stroke-width='1.5' filter='drop-shadow(2px 2px 2px rgba(0,0,0,0.3))'>KAWAGOEYA</text></svg>`;
        window.PREVIEW_HERO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' style='background:%234B2E1E'><text x='50%' y='50%' font-family='sans-serif' font-weight='bold' font-size='40' text-anchor='middle' fill='white'>TOP画像</text></svg>`;

        const PAGE_CONTENT = {
            logoImage: `${BASE_URL}/logo.png`, 
            footerVideo: `${BASE_URL}/MINANA製造工程.mp4`,
            footerImage: `${BASE_URL}/7moro.png`,
            
            hero: {
                title: "創作", 
                subtitle: "ナッツ菓子の技、一粒の芸術。",
                description: "川越屋公認ナッツパティシエが、素材の選定から包装まで、全ての工程に魂を込めて。",
                bgImage: `${BASE_URL}/hero.jpg`,
                fallbackBgImage: "https://images.unsplash.com/photo-1516550135131-fe3dcb0bedc7?q=80&w=1920&auto=format&fit=crop" 
            },
            intro: {
                title: "ナッツパティシエの流儀",
                text: "私たち川越屋は、単にナッツを焼くだけではありません。<br>気温や湿度、ナッツの状態を見極め、職人の経験値で焙煎を調整する。<br>味付は、まさに、パティシエがケーキを作るような繊細な作業です。<br>伝統の技と新しい感性を融合させ、記憶に残る味わいを創造します。"
            }
        };

        const PROCESS_STEPS = [
            {
                id: 1,
                title: "原料入荷",
                engTitle: "Arrival",
                description: "海外からアーモンドやクルミ、カシューナッツなどを調達しています。品質証明書だけでなく、熟練の目利きで鮮度と粒の大きさを確認します。",
                icon: "truck", 
                image: `${BASE_URL}/step1.png`
            },
            {
                id: 2,
                title: "選別",
                engTitle: "Selection",
                description: "最新鋭の選別機と、人の目による最終確認のダブルチェック体制。欠けや変色のある豆を徹底的に取り除き、良質な粒だけを次の工程へ送ります。",
                icon: "check-circle", 
                image: `${BASE_URL}/step2.png`,
                video: `${BASE_URL}/senbetu.mp4` 
            },
            {
                id: 3,
                title: "焙煎",
                engTitle: "Roasting",
                description: "味の決め手となる焙煎。ナッツの種類ごとに最適な温度と時間を設定し、芯まで均一に火を通すことで、香ばしさとカリッとした食感を引き出します。",
                icon: "flame",
                image: `${BASE_URL}/step3.jpg`,
                video: `${BASE_URL}/baisen.mp4` 
            },
            {
                id: 4,
                title: "糖掛け",
                engTitle: "Sugar Coating",
                description: "釜を使用し、熟練の職人が手作業で糖蜜を絡めます。温度管理を徹底し、均一な衣を作ることで、上品な甘さと美しい艶を生み出します。",
                icon: "droplets",
                image: `${BASE_URL}/step4.jpg`,
                video: `${BASE_URL}/ajitsuke.mp4` 
            },
            {
                id: 5,
                title: "粉掛け",
                engTitle: "Powder Coating",
                description: "きな粉、ラズベリーなど、多彩なフレーバーを纏わせます。素材の風味を損なわないよう、パウダーはたっぷり使い、職人の目で確かめながら作業しています。",
                icon: "utensils",
                image: `${BASE_URL}/step5.jpg`,
                video: `${BASE_URL}/konagake.mp4` 
            },
            {
                id: 6,
                title: "包装",
                engTitle: "Packaging",
                description: "正確、丁寧をモットーに真心こめてパッキングしています。金属探知機による最終検査を経て、皆様のもとへ出荷されます。",
                icon: "gift",
                image: `${BASE_URL}/step6.jpg`,
                video: `${BASE_URL}/sio.mp4` 
            }
        ];

        /* === スマホメニュー制御 === */
        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobileMenu');
            if (menu) {
                if (menu.classList.contains('translate-x-full')) {
                    menu.classList.remove('translate-x-full');
                } else {
                    menu.classList.add('translate-x-full');
                }
            }
        }

        /* === 動画モーダル制御 === */
        window.openVideoModal = function(videoSrc) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                const src = videoSrc || PAGE_CONTENT.footerVideo;
                let sourceTag = video.querySelector('source');
                if (!sourceTag) {
                    sourceTag = document.createElement('source');
                    sourceTag.type = 'video/mp4';
                    video.appendChild(sourceTag);
                }
                sourceTag.src = src;
                video.load();
                modal.classList.remove('hidden');
                modal.classList.add('flex'); 
                video.play().catch(e => console.log('Auto-play prevented:', e));
            }
        }

        window.closeVideoModal = function() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                video.pause();
                video.currentTime = 0;
            }
        }

        /* === パスワードモーダル制御 === */
        window.openPasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.value = ''; 
            error.classList.add('hidden'); 
            setTimeout(() => input.focus(), 100);
        }

        window.closePasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.checkPassword = function() {
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            const password = input.value.toLowerCase().trim();
            
            if (password === 'neomoro') {
                closePasswordModal();
                openSecretPage();
            } else {
                error.classList.remove('hidden');
                input.classList.add('border-red-500');
                setTimeout(() => input.classList.remove('border-red-500'), 2000);
            }
        }

        window.openSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.8s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 800);
            document.body.style.overflow = '';
        }

        /* === 各種オーバーレイ制御 === */
        window.openKunsei = function() {
            document.getElementById('kunsei-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeKunsei = function() {
            document.getElementById('kunsei-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openCatalog = function() {
            document.getElementById('catalog-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeCatalog = function() {
            document.getElementById('catalog-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openSmokeNutsDoc = function() {
            document.getElementById('smoke-nuts-doc-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeSmokeNutsDoc = function() {
            document.getElementById('smoke-nuts-doc-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openNbList = function() {
            document.getElementById('nb-list-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeNbList = function() {
            document.getElementById('nb-list-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openSmokeTinmiDoc = function() {
            document.getElementById('smoke-tinmi-doc-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeSmokeTinmiDoc = function() {
            document.getElementById('smoke-tinmi-doc-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openSunaharaCompanyDoc = function() {
            document.getElementById('sunahara-company-doc-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeSunaharaCompanyDoc = function() {
            document.getElementById('sunahara-company-doc-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        window.openManga = function() {
            document.getElementById('manga-overlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        window.closeManga = function() {
            document.getElementById('manga-overlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        /* === 描画ロジック === */

        function renderApp() {
            const app = document.getElementById('app');
            
            // ローディング画面を消す
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            }, 1500);

            const NAV_LINKS = [
                { label: 'ホーム', href: './index.html' },
                { label: '加工場設備', href: './factory.html' },
                { label: '商品一覧', href: './products.html' },
                { label: '燻製商品', href: '#', onclick: 'openKunsei(); return false;' }
            ];

            const navItems = NAV_LINKS.map(item => {
                const onclickAttr = item.onclick ? `onclick="${item.onclick}"` : '';
                return `<a href="${item.href}" ${onclickAttr} class="metal-btn">${item.label}</a>`;
            }).join('');

            const mobileNavItems = NAV_LINKS.map(item => {
                const onclickAttr = item.onclick ? `onclick="${item.onclick}"` : '';
                return `<a href="${item.href}" ${onclickAttr} class="metal-btn text-lg py-3 px-8 w-64 text-center">${item.label}</a>`;
            }).join('');

            const stepsHtml = PROCESS_STEPS.map((step, index) => {
                const stepNum = String(index + 1).padStart(2, '0');

                <!-- Hero Section -->
                <section class="relative h-[65vh] lg:h-[85vh] flex items-center justify-center overflow-hidden bg-[#222]">
                    <div class="absolute inset-0 z-0">
                        <img 
                            src="${PAGE_CONTENT.hero.bgImage}" 
                            alt="Background" 
                            class="w-full h-full object-cover object-top opacity-80" 
                            onerror="this.onerror=null; this.src='${PAGE_CONTENT.hero.fallbackBgImage}';"
                        >
                        <!-- コントラストを高めるグラデーション -->
                        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-transparent to-[#8a8a8a]"></div>
                    </div>
                    <div class="relative z-10 container mx-auto px-6 text-center text-white">
                        <span class="inline-block py-1 px-4 border border-white/50 bg-black/40 backdrop-blur-md rounded text-xs tracking-[0.2em] mb-6 shadow-lg text-shadow">

                        </span>

                        <h1 class="text-5xl md:text-7xl font-serif font-bold mb-6 tracking-wide glass-navy-text">
                            ${PAGE_CONTENT.hero.title}
                        </h1>
                        <!-- ★変更点：白く発光 + 1.5倍サイズ -->
                        <p class="text-3xl md:text-5xl tracking-wider mb-8 font-serif drop-shadow-md text-white font-bold text-glow">
                            ${PAGE_CONTENT.hero.subtitle}
                        </p>
                        <div class="w-24 h-1 bg-[#C5A059] mx-auto rounded-full shadow-[0_0_15px_#C5A059]"></div>
                    </div>
                </section>

                <!-- Intro Section -->
                <section class="py-20 md:py-32 px-6">
                    <div class="container mx-auto max-w-4xl text-center text-stainless">
                        <h2 class="text-3xl md:text-4xl font-serif font-bold mb-10 text-[#1a1a1a] text-engrave">
                            ${PAGE_CONTENT.intro.title}
                        </h2>
                        <p class="text-lg leading-loose text-gray-800 font-medium font-serif" style="text-shadow: 0 1px 0 rgba(255,255,255,0.4);">
                            ${PAGE_CONTENT.intro.text}
                        </p>
                    </div>
                </section>

                <!-- Process Grid -->
                <section class="py-20 px-6">
                    <div class="container mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-end mb-16 border-b border-gray-500 pb-6 shadow-[0_1px_0_rgba(255,255,255,0.3)]">
                            <div>
                                <span class="text-[#C5A059] font-bold tracking-widest text-sm block mb-2" style="text-shadow: 0 1px 0 rgba(0,0,0,0.5);">THE PROCESS</span>
                                <h2 class="text-3xl md:text-4xl font-serif font-bold text-[#1a1a1a] text-engrave">
                                    美味しさを創る6つの工程
                                </h2>
                            </div>
                            <p class="text-gray-800 mt-4 md:mt-0 max-w-md text-sm font-medium" style="text-shadow: 0 1px 0 rgba(255,255,255,0.3);">
                                一つひとつの工程に妥協せず、素材のポテンシャルを最大限に引き出す。それが川越屋のスタンダードです。
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-12">
                            ${stepsHtml}
                        </div>
                    </div>
                </section>

                <!-- OEM / Contact -->
                <section class="py-24 px-6 relative overflow-hidden text-white" style="background: linear-gradient(135deg, #4B2E1E 0%, #2c1a10 100%); border-top: 1px solid #555; border-bottom: 1px solid #555;">
                    <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                        <div class="w-96 h-96 rounded-full bg-white absolute -top-20 -left-20 blur-3xl"></div>
                        <div class="w-96 h-96 rounded-full bg-orange-500 absolute bottom-0 right-0 blur-3xl"></div>
                    </div>
                    <div class="container mx-auto relative z-10 flex flex-col lg:flex-row items-center justify-between gap-12">
                        <div class="lg:w-2/3">
                            <h2 class="text-3xl md:text-5xl font-serif font-bold mb-6 text-glow">オリジナル商品の開発</h2>
                            <p class="text-lg text-white/90 leading-relaxed mb-8 font-light">
                                「こんな味のナッツを作りたい」「地元の特産品とコラボしたい」<br/>
                                そんなアイデアを、私たちの技術で形にしませんか？<br/>
                                製造ロットや仕様につきましては、お客様のご要望に合わせて柔軟に対応いたします。
                            </p>
                            <div class="flex flex-wrap gap-4">
                                <div class="flex items-center gap-2 text-sm bg-white/10 px-6 py-3 rounded-full border border-white/30 backdrop-blur-md shadow-lg">
                                 <i data-lucide="check-circle" class="w-5 h-5 text-orange-300"></i> 試作開発対応
                               </div>
                               <div class="flex items-center gap-2 text-sm bg-white/10 px-6 py-3 rounded-full border border-white/30 backdrop-blur-md shadow-lg">
                                 <i data-lucide="check-circle" class="w-5 h-5 text-orange-300"></i> パッケージ提案
                               </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Footer (Black Metal) -->
                <footer class="bg-[#111] text-white pt-20 pb-10 px-6 border-t-4 border-[#333] shadow-[inset_0_10px_20px_rgba(0,0,0,1)]">
                    <div class="container mx-auto">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-12 mb-16 border-b border-[#333] pb-12">
                            <div class="md:col-span-1">
                                <div class="mb-6 flex justify-center md:justify-center">
                                    <div class="relative group cursor-pointer" onclick="openVideoModal()">
                                        <img src="${PAGE_CONTENT.footerImage}" alt="KAWAGOEYA" class="h-64 w-auto object-contain transition-transform duration-300 group-hover:scale-105" 
                                            onerror="this.onerror=null; this.parentNode.innerHTML = '<div class=\'h-64 w-48 bg-[#222] rounded flex items-center justify-center border border-[#444]\'><span>Image N/A</span></div>';">
                                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                            <div class="bg-black/70 rounded-full p-4 backdrop-blur-sm border border-[#C5A059] shadow-[0_0_20px_#C5A059]">
                                                <i data-lucide="play" class="w-8 h-8 text-[#C5A059] fill-[#C5A059]"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h4 class="font-bold mb-6 text-[#ccc] border-b border-[#555] pb-2 inline-block">メニュー</h4>
                                <ul class="space-y-4 text-sm text-[#999]">
                                    <li><a href="./index.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>ホーム</a></li>
                                    <li><a href="./factory.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>加工場設備</a></li>
                                    <li><a href="./products.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>商品一覧</a></li>
                                    <li><a href="#" onclick="openKunsei(); return false;" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>燻製商品</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="font-bold mb-6 text-[#ccc] border-b border-[#555] pb-2 inline-block">商品カテゴリー</h4>
                                <ul class="space-y-4 text-sm text-[#999]">
                                    <li><a href="./products.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>素焼きナッツ（準備中）</a></li>
                                    <li><a href="./products.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>フレーバーナッツ（準備中）</a></li>
                                    <li><a href="./products.html" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>業務用（準備中）</a></li>
                                    <li><a href="#" onclick="openCatalog(); return false;" class="hover:text-white transition-colors flex items-center gap-2"><i data-lucide="chevron-right" class="w-3 h-3 text-[#555]"></i>NB商品カタログ</a></li>
                                </ul>
                            </div>
                        </div>
                        
                        <!-- Footer Bottom Area with Secret Link -->
                        <div class="flex flex-col md:flex-row justify-between items-center gap-6 pt-4">
                            <p class="text-xs text-[#666]">
                                &copy; ${new Date().getFullYear()} KAWAGOEYA Co., Ltd. All Rights Reserved.
                            </p>
                            <div class="flex items-center">
                                <button onclick="openPasswordModal()" class="gold-metal-btn text-sm font-bold flex items-center gap-2 px-8 py-3 rounded-full shadow-lg transform hover:scale-105 transition-transform">
                                    <i data-lucide="lock" class="w-4 h-4"></i>
                                    特設ページ <span class="text-[10px] uppercase tracking-wider ml-1 font-normal opacity-80">Members Only</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </footer>

                <!-- Scroll to Top (Stainless Style) -->
                <button id="scrollToTop" class="metal-btn fixed bottom-8 right-8 !p-3 !rounded-full opacity-0 translate-y-10 pointer-events-none z-40">
                    <i data-lucide="arrow-up" class="w-5 h-5"></i>
                </button>
            `;

            // Lucideアイコンの初期化
            lucide.createIcons();
            
            // スクロールイベント
            const scrollBtn = document.getElementById('scrollToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    scrollBtn.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    scrollBtn.classList.add('opacity-100', 'translate-y-0');
                } else {
                    scrollBtn.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    scrollBtn.classList.remove('opacity-100', 'translate-y-0');
                }
            });
            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            // Password input
            const passInput = document.getElementById('secretPassword');
            if(passInput) {
                passInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') checkPassword();
                });
            }
        }

        // 初期描画実行
        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
