<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川越屋 KAWAGOEYA - 創作</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            /* ステンレス・ヘアライン風の背景 */
            background-color: #8a8a8a; /* ベースの金属色 */
            background-image: 
                /* 1. 細かいヘアライン（横縞） */
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 1px,
                    rgba(255, 255, 255, 0.08) 1px,
                    rgba(255, 255, 255, 0.08) 2px
                ),
                /* 2. 金属特有の乱反射（縦の光沢） */
                linear-gradient(
                    90deg, 
                    #999 0%, 
                    #ddd 15%, 
                    #bbb 30%, 
                    #eee 50%, 
                    #bbb 70%, 
                    #ddd 85%, 
                    #999 100%
                );
            background-blend-mode: overlay;
            background-attachment: fixed; /* スクロール時に背景を固定して金属板の重量感を出す */
            color: #1a1a1a;
        }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-sans { font-family: 'Noto Sans JP', sans-serif; }
        
        /* モーダル表示時のアニメーション */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-animate {
            animation: fadeIn 0.3s ease-out;
        }

        /* --- ステンレス・メタリックデザイン --- */

        /* 1. 黒の光沢ボード（パネル） */
        .glossy-black-panel {
            /* ベース：漆黒 */
            background-color: #000000;
            
            /* 映り込みの表現：上部は空の反射で少し明るく、下部は暗く */
            background-image: linear-gradient(180deg, rgba(40,40,40,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%);
            
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            
            /* ガラスの厚みとエッジの光沢 */
            border: 1px solid #111; /* 黒い枠 */
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),      /* 深いドロップシャドウ */
                inset 0 1px 0 rgba(255,255,255,0.5), /* 上辺の鋭いハイライト（エッジ） */
                inset 0 0 0 1px rgba(255,255,255,0.05); /* 全体の微かなフチ */
            
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s ease;
            cursor: pointer; /* クリックできることを示す */
        }

        /* パネル表面の強い光沢（テカり） */
        .glossy-black-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%; /* 上部に強い光沢 */
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 12px 12px 60% 60% / 10px 10px 15px 15px; /* 湾曲した光 */
            pointer-events: none;
        }

        /* 斜めの走る光（フレア） */
        .glossy-black-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 200%;
            height: 200%;
            /* 鋭い光の帯 */
            background: linear-gradient(
                115deg, 
                transparent 40%, 
                rgba(255,255,255,0.3) 45%, 
                rgba(255,255,255,0.6) 50%, 
                rgba(255,255,255,0.3) 55%, 
                transparent 60%
            );
            pointer-events: none;
            opacity: 0.0; /* 通常時は非表示 */
            transition: opacity 0.3s, left 0.7s ease; 
        }

        /* ホバー時の挙動 */
        .glossy-black-panel:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9),
                inset 0 1px 0 rgba(255,255,255,0.7); /* ハイライト強化 */
        }
        .glossy-black-panel:hover::before {
            opacity: 0.5;
            left: 100%; /* 光が右へ抜ける */
        }

        /* --- ヘッダー・フッター用メタルプレート --- */
        .metal-plate {
            background: linear-gradient(180deg, #e8e8e8 0%, #c0c0c0 49%, #a0a0a0 50%, #d0d0d0 100%);
            border-top: 1px solid #fff;
            border-bottom: 1px solid #666;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: #1a1a1a;
        }

        /* --- リアル・ステンレスボタン --- */
        .metal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* クロムメッキのような強い反射 */
            background: linear-gradient(180deg, #f0f0f0 0%, #dcdcdc 49%, #a0a0a0 50%, #cecece 100%);
            color: #000 !important;
            padding: 10px 28px;
            border-radius: 4px;
            border: 1px solid #666;
            /* 押し出し感 */
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,1),
                0 2px 5px rgba(0,0,0,0.5);
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            font-weight: bold;
            text-decoration: none;
            transition: all 0.1s ease;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            white-space: nowrap;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .metal-btn:hover {
            /* より明るく、青白い光沢 */
            background: linear-gradient(180deg, #ffffff 0%, #eeeeee 49%, #c0c0c0 50%, #e0e0e0 100%);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,1),
                0 0 10px rgba(255,255,255,0.8), /* 発光 */
                0 3px 6px rgba(0,0,0,0.6);
            transform: translateY(-1px);
            border-color: #888;
        }
        
        .metal-btn:active {
            background: linear-gradient(180deg, #999 0%, #bbb 100%);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
            transform: translateY(1px);
            border-color: #333;
        }

        /* --- ゴールドボタン（鏡面仕上げ） --- */
        .gold-metal-btn {
            background: linear-gradient(180deg, #fffcdb 0%, #f3d77e 49%, #c5a059 50%, #e6cf8b 100%);
            border: 1px solid #8a6e3e;
            color: #3e2723 !important;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 2px 5px rgba(0,0,0,0.4),
                0 0 0 2px rgba(197, 160, 89, 0.3); /* 外側のグロー */
        }
        .gold-metal-btn:hover {
            background: linear-gradient(180deg, #fff 0%, #ffeaa7 49%, #d4af37 50%, #f5e0a0 100%);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,1),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 4px 8px rgba(0,0,0,0.5);
        }

        /* --- パスワード入力フィールド（ハイテク黒） --- */
        .password-input {
            background: #000;
            border: 1px solid #444;
            border-bottom: 2px solid #C5A059; /* ゴールドのライン */
            color: #C5A059;
            padding: 12px 15px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 0.3em;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace; /* デジタル感 */
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }
        .password-input:focus {
            border-color: #fff;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,1),
                0 0 15px rgba(197,160,89,0.5);
            color: #fff;
        }
        .password-input::placeholder {
            color: #333;
            letter-spacing: normal;
            font-size: 0.9rem;
            font-family: sans-serif;
        }

        /* --- 特設ページオーバーレイ（漆黒） --- */
        #secret-overlay {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 70%);
            color: white;
        }

        /* --- 燻製商品オーバーレイ（ステンレス） --- */
        #kunsei-overlay {
            /* bodyと同じステンレス背景を適用 */
            background-color: #8a8a8a;
            background-image: 
                repeating-linear-gradient(0deg, transparent 0px, transparent 1px, rgba(255, 255, 255, 0.08) 1px, rgba(255, 255, 255, 0.08) 2px),
                linear-gradient(90deg, #999 0%, #ddd 15%, #bbb 30%, #eee 50%, #bbb 70%, #ddd 85%, #999 100%);
            background-blend-mode: overlay;
            background-attachment: fixed;
            color: #1a1a1a;
        }

        /* --- カタログページオーバーレイ（共通） --- */
        #catalog-overlay, #smoke-nuts-doc-overlay, #nb-list-overlay, #smoke-tinmi-doc-overlay {
            background-color: #f5f5f5;
            color: #333;
        }
        .catalog-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .catalog-page {
            display: block;
            width: 100%;
            height: auto;
            border-bottom: 1px solid #eee;
            font-size: 0;
        }
        .catalog-page img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* テキストエフェクト */
        .text-engrave {
            color: rgba(0,0,0,0.75);
            text-shadow: 1px 1px 0 rgba(255,255,255,0.6); /* 彫り込み効果 */
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .text-shadow-strong {
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- タイトル文字デザイン --- */
        /* 紺色のガラスコーティング + ゴールド縁取り */
        .glass-navy-text {
            /* ベースの紺色グラデーション（ガラスの光沢感） */
            background: linear-gradient(
                135deg, 
                #405080 0%, 
                #1a2a50 50%, 
                #000033 51%, 
                #203060 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            
            /* ゴールドの縁取り */
            -webkit-text-stroke: 1.5px #C5A059;
            
            /* ガラスの厚みを感じさせるドロップシャドウ */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body>

    <!-- アプリケーションのコンテナ -->
    <div id="app">
        <!-- コンテンツはJavaScriptによってここに描画されます -->
    </div>

    <!-- JavaScript Logic -->
    <script>
        const BRAND_COLORS = {
            primary: '#4B2E1E',
            gold: '#C5A059',
            bg: '#F9F7F2',
        };

        const BASE_URL = 'https://rasuta55.github.io/kawagoeya';

        window.PREVIEW_LOGO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><rect width='200' height='60' fill='transparent'/><text x='100' y='40' font-family='Noto Serif JP, serif' font-weight='bold' font-size='24' text-anchor='middle' fill='%231a1a1a' stroke='%23fff' stroke-width='1'>KAWAGOEYA</text></svg>`;
        window.PREVIEW_HERO_DATA = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' style='background:%234B2E1E'><text x='50%' y='50%' font-family='sans-serif' font-weight='bold' font-size='40' text-anchor='middle' fill='white'>TOP画像</text></svg>`;

        const PAGE_CONTENT = {
            logoImage: `${BASE_URL}/logo.png`, 
            footerVideo: `${BASE_URL}/MINANA製造工程.mp4`,
            footerImage: `${BASE_URL}/7moro.png`,
            
            hero: {
                title: "創作", 
                subtitle: "ナッツ菓子の技、一粒の芸術。",
                description: "川越屋公認ナッツパティシエが、素材の選定から包装まで、全ての工程に魂を込めて。",
                bgImage: `${BASE_URL}/hero.jpg`,
                fallbackBgImage: "https://images.unsplash.com/photo-1516550135131-fe3dcb0bedc7?q=80&w=1920&auto=format&fit=crop" 
            },
            intro: {
                title: "ナッツパティシエの流儀",
                text: "私たち川越屋は、単にナッツを焼くだけではありません。<br>気温や湿度、ナッツの状態を見極め、職人の経験値で焙煎を調整する。<br>味付は、まさに、パティシエがケーキを作るような繊細な作業です。<br>伝統の技と新しい感性を融合させ、記憶に残る味わいを創造します。"
            }
        };

        const PROCESS_STEPS = [
            {
                id: 1,
                title: "原料入荷",
                engTitle: "Arrival",
                description: "海外からアーモンドやクルミ、カシューナッツなどを調達しています。品質証明書だけでなく、熟練の目利きで鮮度と粒の大きさを確認します。",
                icon: "truck", 
                image: `${BASE_URL}/step1.png`
                // 動画なし（画像のみ）
            },
            {
                id: 2,
                title: "選別",
                engTitle: "Selection",
                description: "最新鋭の選別機と、人の目による最終確認のダブルチェック体制。欠けや変色のある豆を徹底的に取り除き、良質な粒だけを次の工程へ送ります。",
                icon: "check-circle", 
                image: `${BASE_URL}/step2.png`,
                video: `${BASE_URL}/senbetu.mp4` // 追加: 動画
            },
            {
                id: 3,
                title: "焙煎",
                engTitle: "Roasting",
                description: "味の決め手となる焙煎。ナッツの種類ごとに最適な温度と時間を設定し、芯まで均一に火を通すことで、香ばしさとカリッとした食感を引き出します。",
                icon: "flame",
                image: `${BASE_URL}/step3.jpg`,
                video: `${BASE_URL}/baisen.mp4` // 追加: 動画
            },
            {
                id: 4,
                title: "糖掛け",
                engTitle: "Sugar Coating",
                description: "釜を使用し、熟練の職人が手作業で糖蜜を絡めます。温度管理を徹底し、均一な衣を作ることで、上品な甘さと美しい艶を生み出します。",
                icon: "droplets",
                image: `${BASE_URL}/step4.jpg`,
                video: `${BASE_URL}/ajitsuke.mp4` // 追加: 動画
            },
            {
                id: 5,
                title: "粉掛け",
                engTitle: "Powder Coating",
                description: "きな粉、ラズベリーなど、多彩なフレーバーを纏わせます。素材の風味を損なわないよう、パウダーはたっぷり使い、職人の目で確かめながら作業しています。",
                icon: "utensils",
                image: `${BASE_URL}/step5.jpg`,
                video: `${BASE_URL}/konagake.mp4` // 追加: 動画
            },
            {
                id: 6,
                title: "包装",
                engTitle: "Packaging",
                description: "正確、丁寧をモットーに真心こめてパッキングしています。金属探知機による最終検査を経て、皆様のもとへ出荷されます。",
                icon: "gift",
                image: `${BASE_URL}/step6.jpg`,
                video: `${BASE_URL}/sio.mp4` // 追加: 動画
            }
        ];

        /* === スマホメニュー制御 === */
        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobileMenu');
            if (menu) {
                if (menu.classList.contains('translate-x-full')) {
                    menu.classList.remove('translate-x-full');
                } else {
                    menu.classList.add('translate-x-full');
                }
            }
        }

        /* === 動画モーダル制御 === */
        window.openVideoModal = function(videoSrc) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                const src = videoSrc || PAGE_CONTENT.footerVideo;
                let sourceTag = video.querySelector('source');
                if (!sourceTag) {
                    sourceTag = document.createElement('source');
                    sourceTag.type = 'video/mp4';
                    video.appendChild(sourceTag);
                }
                sourceTag.src = src;
                video.load();
                modal.classList.remove('hidden');
                modal.classList.add('flex'); 
                video.play().catch(e => console.log('Auto-play prevented:', e));
            }
        }

        window.closeVideoModal = function() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('promoVideo');
            if(modal && video) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                video.pause();
                video.currentTime = 0;
            }
        }

        /* === パスワードモーダル制御 === */
        window.openPasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.value = ''; 
            error.classList.add('hidden'); 
            setTimeout(() => input.focus(), 100);
        }

        window.closePasswordModal = function() {
            const modal = document.getElementById('passwordModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.checkPassword = function() {
            const input = document.getElementById('secretPassword');
            const error = document.getElementById('passwordError');
            const password = input.value.toLowerCase().trim();
            
            if (password === 'neomoro') {
                closePasswordModal();
                openSecretPage();
            } else {
                error.classList.remove('hidden');
                input.classList.add('border-red-500');
                setTimeout(() => input.classList.remove('border-red-500'), 2000);
            }
        }

        window.openSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.8s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeSecretPage = function() {
            const overlay = document.getElementById('secret-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 800);
            document.body.style.overflow = '';
        }

        /* === 燻製商品オーバーレイ制御 === */
        window.openKunsei = function() {
            const overlay = document.getElementById('kunsei-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.8s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeKunsei = function() {
            const overlay = document.getElementById('kunsei-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 800);
            document.body.style.overflow = '';
        }

        /* === カタログモーダル制御 === */
        window.openCatalog = function() {
            const overlay = document.getElementById('catalog-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.5s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeCatalog = function() {
            const overlay = document.getElementById('catalog-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 500);
            document.body.style.overflow = '';
        }

        /* === スモークナッツ資料モーダル制御 === */
        window.openSmokeNutsDoc = function() {
            const overlay = document.getElementById('smoke-nuts-doc-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.5s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeSmokeNutsDoc = function() {
            const overlay = document.getElementById('smoke-nuts-doc-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 500);
            document.body.style.overflow = '';
        }

        /* === NB商品リストモーダル制御 === */
        window.openNbList = function() {
            const overlay = document.getElementById('nb-list-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.5s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }

        window.closeNbList = function() {
            const overlay = document.getElementById('nb-list-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 500);
            document.body.style.overflow = '';
        }

        /* === スナハラ燻製所（燻製珍味）資料モーダル制御 === */
        window.openSmokeTinmiDoc = function() {
            const overlay = document.getElementById('smoke-tinmi-doc-overlay');
            overlay.classList.remove('hidden');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.5s ease';
                overlay.style.opacity = '1';
            }, 10);
            document.body.style.overflow = 'hidden';
            overlay.scrollTop = 0;
        }
